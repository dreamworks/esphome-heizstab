esphome:
  name: esphome-web-69f790
  friendly_name: ESP Heizstab
  min_version: 2026.4.0
  name_add_mac_suffix: false
  project:
    name: "heizstab.controller"
    version: "1.1.0"

esp32:
  board: esp32dev
  variant: esp32
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    encryption: {}            # nutzt den API-Key, kein separates OTA-Passwort

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password

captive_portal:

globals:
  - id: ble_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_ble_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: ble_seen
    type: std::set<std::string>
    restore_value: no
  - id: heizstab_level
    type: int
    restore_value: no
    initial_value: '0'

interval:
  - interval: 30s
    then:
      - lambda: |-
          id(ble_count) = 0;
          id(ble_seen).clear();

spi:
  - id: lcd
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      number: GPIO12
      ignore_strapping_warning: true
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
  - platform: slow_pwm
    pin: GPIO27
    period: 60s
    id: heizstab_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

# Einzige Stelle, die die Leistung setzt: Global, SSR-PWM und HA-Number
# werden gemeinsam aktualisiert, damit Display und Home Assistant synchron sind.
script:
  - id: set_heizstab_level
    mode: queued
    parameters:
      lv: int
    then:
      - lambda: |-
          int l = lv < 0 ? 0 : (lv > 4 ? 4 : lv);
          id(heizstab_level) = l;
          id(heizstab_pwm).set_level(l * 0.25f);
          id(heizstab_pct).publish_state(l * 25.0f);

number:
  - platform: template
    name: "Heizstab Leistung"
    id: heizstab_pct
    min_value: 0
    max_value: 100
    step: 25
    initial_value: 0
    unit_of_measurement: "%"
    set_action:
      - script.execute:
          id: set_heizstab_level
          lv: !lambda 'return (int)(x / 25.0f + 0.5f);'

# x = vertikale Achse (Buttonzeile), y = horizontale Achse (welcher Button)
# y-Bereiche grenzen lückenlos aneinander, ohne Überlappung (Grenzen inklusiv)
binary_sensor:
  - platform: touchscreen
    touchscreen_id: my_touch
    name: "Heizstab 0%"
    internal: true
    x_min: 265
    x_max: 320
    y_min: 0
    y_max: 59
    on_press:
      - script.execute:
          id: set_heizstab_level
          lv: 0
  - platform: touchscreen
    touchscreen_id: my_touch
    name: "Heizstab 25%"
    internal: true
    x_min: 265
    x_max: 320
    y_min: 60
    y_max: 102
    on_press:
      - script.execute:
          id: set_heizstab_level
          lv: 1
  - platform: touchscreen
    touchscreen_id: my_touch
    name: "Heizstab 50%"
    internal: true
    x_min: 265
    x_max: 320
    y_min: 103
    y_max: 145
    on_press:
      - script.execute:
          id: set_heizstab_level
          lv: 2
  - platform: touchscreen
    touchscreen_id: my_touch
    name: "Heizstab 75%"
    internal: true
    x_min: 265
    x_max: 320
    y_min: 146
    y_max: 187
    on_press:
      - script.execute:
          id: set_heizstab_level
          lv: 3
  - platform: touchscreen
    touchscreen_id: my_touch
    name: "Heizstab 100%"
    internal: true
    x_min: 265
    x_max: 320
    y_min: 188
    y_max: 240
    on_press:
      - script.execute:
          id: set_heizstab_level
          lv: 4

sensor:
  - platform: wifi_signal
    id: wifi_signal_db
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip

font:
  - file: "gfonts://Open+Sans"
    id: os_small
    size: 13
  - file: "gfonts://Open+Sans"
    id: os_med
    size: 18
  - file: "gfonts://Open+Sans@700"
    id: os_bold
    size: 20
  - file: "gfonts://Oswald"
    id: oswald_big
    size: 48
  - file: "gfonts://Oswald"
    id: oswald_med
    size: 22

touchscreen:
  - platform: xpt2046
    spi_id: touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    id: my_touch
    calibration:
      x_min: 300
      x_max: 3500
      y_min: 200
      y_max: 3520

esp32_ble_tracker:
  scan_parameters:
    # Fenster < Intervall, damit WiFi auf dem gemeinsamen Funkmodul Sendezeit bekommt
    interval: 320ms
    window: 300ms
    active: true
  on_ble_advertise:
    then:
      - lambda: |-
          std::string mac = x.address_str();
          std::string name = x.get_name();
          if (name.rfind("esphome", 0) == 0) return;
          if (id(ble_seen).find(mac) == id(ble_seen).end()) {
            id(ble_seen).insert(mac);
            id(ble_count) += 1;
          }
          if (name.length() > 0) {
            id(last_ble_name) = name;
          } else {
            id(last_ble_name) = mac;
          }

bluetooth_proxy:
  active: true

display:
  - platform: ili9xxx
    model: ILI9341
    spi_id: lcd
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    data_rate: 20MHz
    invert_colors: false
    color_order: bgr
    color_palette: 8BIT
    rotation: 90
    update_interval: 1s
    lambda: |-
      auto RED    = Color(255, 0, 0);
      auto WHITE  = Color(255, 255, 255);
      auto GRAY   = Color(80, 80, 80);
      auto LGRAY  = Color(160, 160, 160);
      auto BLACK  = Color(0, 0, 0);
      auto DKRED  = Color(120, 0, 0);
      auto ORANGE = Color(255, 140, 0);

      it.fill(BLACK);

      it.filled_rectangle(0, 0, 320, 36, RED);
      it.printf(10, 6, id(os_bold), WHITE, "ESP HEIZSTAB");
      it.printf(148, 12, id(os_small), Color(255,180,180), "v" ESPHOME_PROJECT_VERSION);
      it.printf(220, 8, id(os_small), WHITE, "%.0f dBm", id(wifi_signal_db).state);
      int sig = (int)id(wifi_signal_db).state;
      auto bar_col = [&](int threshold) { return sig > threshold ? WHITE : DKRED; };
      it.filled_rectangle(285, 26, 6, 8,  bar_col(-90));
      it.filled_rectangle(293, 20, 6, 14, bar_col(-75));
      it.filled_rectangle(301, 14, 6, 20, bar_col(-65));
      it.filled_rectangle(309, 8,  6, 26, bar_col(-55));

      it.printf(10, 44, id(os_small), LGRAY, "IP");
      it.printf(30, 43, id(os_med), WHITE, "%s", id(wifi_ip).state.c_str());
      it.filled_rectangle(0, 68, 320, 1, RED);

      it.printf(10, 73, id(os_small), RED, "BLUETOOTH  /  30s");
      it.printf(10, 90, id(oswald_big), WHITE, "%d", id(ble_count));
      it.printf(80, 95, id(os_small), LGRAY, "Geraete");
      it.printf(80, 112, id(os_small), LGRAY, "erkannt");
      it.filled_rectangle(140, 88, 1, 60, GRAY);
      it.printf(150, 90, id(os_small), RED, "ZULETZT");
      it.printf(150, 108, id(os_med), WHITE, "%s", id(last_ble_name).c_str());
      it.filled_rectangle(0, 158, 320, 1, RED);

      it.printf(10, 164, id(os_small), RED, "SSR / HEIZSTAB");
      int lv = id(heizstab_level);
      const char* lvl_str[] = {"AUS", "25%", "50%", "75%", "100%"};
      auto lv_col = lv == 0 ? LGRAY : ORANGE;
      it.printf(10, 178, id(oswald_med), lv_col, "%s", lvl_str[lv]);

      int bx[] = {9, 70, 131, 192, 253};
      const char* bl[] = {"0", "1/4", "1/2", "3/4", "1"};
      for (int i = 0; i < 5; i++) {
        bool active = (i == lv);
        it.filled_rectangle(bx[i], 207, 58, 28,
                            active ? RED : Color(40, 40, 40));
        it.printf(bx[i] + 29, 221, id(os_small),
                  active ? WHITE : LGRAY,
                  TextAlign::CENTER, "%s", bl[i]);
      }
